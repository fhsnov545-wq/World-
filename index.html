<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minecraft Castle World</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            background-color: #fca048;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            touch-action: none;
            z-index: 10;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
        }
        #touch-look {
            position: absolute;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            z-index: 5;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            color: white;
            font-size: 22px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="crosshair">+</div>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="touch-look"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- SEHNƏ VƏ KAMERA ---
        const scene = new THREE.Scene();
        // Şəkildəki qürub çağı narıncı səma rəngi
        scene.background = new THREE.Color(0xd98236); 
        scene.fog = new THREE.Fog(0xd98236, 30, 90);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- QÜRUB İŞIQLANDIRMASI ---
        const ambientLight = new THREE.AmbientLight(0xffd8b1, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xff8c00, 1.2);
        sunLight.position.set(-40, 30, -40);
        scene.add(sunLight);

        // --- MATERİALLAR ---
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        
        const grassMat = new THREE.MeshLambertMaterial({ color: 0x477826 });
        const stoneMat = new THREE.MeshLambertMaterial({ color: 0x6e6e6e });
        const darkStoneMat = new THREE.MeshLambertMaterial({ color: 0x4a4a4a });
        const woodMat = new THREE.MeshLambertMaterial({ color: 0x5c3a21 });
        const plankMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
        const roofMat = new THREE.MeshLambertMaterial({ color: 0x7c211e });
        const blueRoofMat = new THREE.MeshLambertMaterial({ color: 0x1d3557 });
        const waterMat = new THREE.MeshLambertMaterial({ color: 0x2b6589, transparent: true, opacity: 0.8 });
        const leafMat = new THREE.MeshLambertMaterial({ color: 0x2d5a1e });
        const cropMat = new THREE.MeshLambertMaterial({ color: 0x98a12e });

        // --- ARAZİ VƏ ÇAY (LƏNDŞAFT) ---
        const worldSize = 70;
        
        for (let x = -worldSize/2; x < worldSize/2; x++) {
            for (let z = -worldSize/2; z < worldSize/2; z++) {
                // Şəkildəki çay yatağı
                const isRiver = Math.sin(x * 0.1) * 6 + (x * 0.4) > z - 5 && Math.sin(x * 0.1) * 6 + (x * 0.4) < z + 2;
                
                if (isRiver) {
                    const water = new THREE.Mesh(boxGeo, waterMat);
                    water.position.set(x, -0.2, z);
                    scene.add(water);
                } else {
                    // Təpəlik relied
                    let h = Math.floor(Math.sin(x * 0.1) * Math.cos(z * 0.1) * 2);
                    
                    // Qalanın yerləşdiyi yüksəklik
                    if (x > -5 && x < 25 && z > -5 && z < 25) h = Math.max(h, 2);

                    for (let y = 0; y <= h; y++) {
                        const mat = (y === h) ? grassMat : stoneMat;
                        const block = new THREE.Mesh(boxGeo, mat);
                        block.position.set(x, y, z);
                        scene.add(block);
                    }
                }
            }
        }

        // --- İSTİNADƏ UĞUN QALA VƏ KÖRPÜ ---
        function buildCastle() {
            const baseX = 5, baseZ = 5, baseH = 2;

            // Qala Divarları (Böyük həyət)
            for (let x = -2; x <= 18; x++) {
                for (let z = -2; z <= 18; z++) {
                    const isWall = x === -2 || x === 18 || z === -2 || z === 18;
                    if (isWall && !(z === -2 && (x >= 6 && x <= 10))) { // Qapı yeri
                        for (let y = 1; y <= 6; y++) {
                            const block = new THREE.Mesh(boxGeo, stoneMat);
                            block.position.set(baseX + x, baseH + y, baseZ + z);
                            scene.add(block);
                        }
                    }
                }
            }

            // Qala Bürc qüllələri (Künclərdə)
            const towers = [[-2,-2], [18,-2], [-2,18], [18,18], [3,5], [13,5]];
            towers.forEach(([tx, tz]) => {
                for (let y = 1; y <= 12; y++) {
                    for (let bx = -1; bx <= 1; bx++) {
                        for (let bz = -1; bz <= 1; bz++) {
                            const block = new THREE.Mesh(boxGeo, darkStoneMat);
                            block.position.set(baseX + tx + bx, baseH + y, baseZ + tz + bz);
                            scene.add(block);
                        }
                    }
                }
                // Bürcün Qırmızı/Göy damı
                for (let ry = 0; ry < 4; ry++) {
                    const rBlock = new THREE.Mesh(boxGeo, (tx > 8) ? blueRoofMat : roofMat);
                    rBlock.position.set(baseX + tx, baseH + 13 + ry, baseZ + tz);
                    scene.add(rBlock);
                }
            });

            // Əsas Qəsrin Mərkəzi Binası
            for (let x = 3; x <= 13; x++) {
                for (let z = 8; z <= 16; z++) {
                    for (let y = 1; y <= 10; y++) {
                        if (x === 3 || x === 13 || z === 8 || z === 16 || y === 10) {
                            const block = new THREE.Mesh(boxGeo, stoneMat);
                            block.position.set(baseX + x, baseH + y, baseZ + z);
                            scene.add(block);
                        }
                    }
                }
            }

            // Qalanın Giriş Körpüsü (Drawbridge)
            for (let z = -6; z <= -2; z++) {
                for (let x = 7; x <= 9; x++) {
                    const bridge = new THREE.Mesh(boxGeo, plankMat);
                    bridge.position.set(baseX + x, baseH + 0.5, baseZ + z);
                    scene.add(bridge);
                }
            }
        }

        // --- KƏND EVLƏRİ VƏ FERMALAR ---
        function buildVillage() {
            const houses = [[-15, -10], [-12, -20], [-22, -12]];
            houses.forEach(([hx, hz]) => {
                for (let x = 0; x < 5; x++) {
                    for (let z = 0; z < 5; z++) {
                        for (let y = 1; y <= 4; y++) {
                            const isEdge = x === 0 || x === 4 || z === 0 || z === 4;
                            const isDoor = (z === 0 && x === 2 && y <= 2);
                            if (isDoor) continue; // İçəri girmək üçün acıq qapı

                            if (y === 4) {
                                const roof = new THREE.Mesh(boxGeo, roofMat);
                                roof.position.set(hx + x, y, hz + z);
                                scene.add(roof);
                            } else if (isEdge) {
                                const wall = new THREE.Mesh(boxGeo, woodMat);
                                wall.position.set(hx + x, y, hz + z);
                                scene.add(wall);
                            }
                        }
                    }
                }
            });

            // Əkin sahələri (Fermalar)
            for (let x = -20; x <= -10; x++) {
                for (let z = -5; z <= -2; z++) {
                    const crop = new THREE.Mesh(boxGeo, cropMat);
                    crop.position.set(x, 0.2, z);
                    scene.add(crop);
                }
            }
        }

        // --- AĞACLAR ---
        function buildTrees() {
            const positions = [[-25, 10], [-18, 15], [20, -15], [25, 5], [-5, -25]];
            positions.forEach(([tx, tz]) => {
                for (let y = 1; y <= 4; y++) {
                    const log = new THREE.Mesh(boxGeo, woodMat);
                    log.position.set(tx, y, tz);
                    scene.add(log);
                }
                for (let lx = -2; lx <= 2; lx++) {
                    for (let lz = -2; lz <= 2; lz++) {
                        for (let ly = 4; ly <= 6; ly++) {
                            const leaf = new THREE.Mesh(boxGeo, leafMat);
                            leaf.position.set(tx + lx, ly, tz + lz);
                            scene.add(leaf);
                        }
                    }
                }
            });
        }

        buildCastle();
        buildVillage();
        buildTrees();

        // --- OYUNÇU VƏ MOBİL İDARƏƏTMƏ ---
        camera.position.set(-10, 8, -20);
        let yaw = Math.PI / 4, pitch = -0.2;

        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        const touchLook = document.getElementById('touch-look');

        let moveData = { x: 0, y: 0 };
        let joystickActive = false;
        let joyStartX = 0, joyStartY = 0;

        joystickZone.addEventListener('touchstart', (e) => {
            joystickActive = true;
            const touch = e.touches[0];
            joyStartX = touch.clientX;
            joyStartY = touch.clientY;
        });

        joystickZone.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            const touch = e.touches[0];
            let dx = touch.clientX - joyStartX;
            let dy = touch.clientY - joyStartY;
            let dist = Math.min(Math.hypot(dx, dy), 40);
            let angle = Math.atan2(dy, dx);

            let moveX = Math.cos(angle) * dist;
            let moveY = Math.sin(angle) * dist;

            joystickKnob.style.transform = `translate(${moveX}px, ${moveY}px)`;
            moveData.x = moveX / 40;
            moveData.y = moveY / 40;
        });

        const resetJoystick = () => {
            joystickActive = false;
            moveData = { x: 0, y: 0 };
            joystickKnob.style.transform = `translate(0px, 0px)`;
        };

        joystickZone.addEventListener('touchend', resetJoystick);
        joystickZone.addEventListener('touchcancel', resetJoystick);

        let lastTouchX = 0, lastTouchY = 0;
        touchLook.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
        });

        touchLook.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            let dx = touch.clientX - lastTouchX;
            let dy = touch.clientY - lastTouchY;

            yaw -= dx * 0.005;
            pitch -= dy * 0.005;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
        });

        // --- ANIMASIYA DÖVRÜ ---
        const speed = 0.15;

        function animate() {
            requestAnimationFrame(animate);

            if (moveData.x !== 0 || moveData.y !== 0) {
                const forwardX = -Math.sin(yaw);
                const forwardZ = -Math.cos(yaw);
                const sideX = Math.cos(yaw);
                const sideZ = -Math.sin(yaw);

                camera.position.x += (forwardX * (-moveData.y) + sideX * moveData.x) * speed;
                camera.position.z += (forwardZ * (-moveData.y) + sideZ * moveData.x) * speed;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
